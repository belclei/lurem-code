<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256"
     width="256"
     height="256">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1420"/>
      <stop offset="100%" stop-color="#111C2A"/>
    </linearGradient>

    <linearGradient id="tower" x1="0" x2="1">
      <stop offset="0%" stop-color="#F5F1E8"/>
      <stop offset="100%" stop-color="#DDD6C9"/>
    </linearGradient>

    <radialGradient id="light" cx="50%" cy="38%">
      <stop offset="0%" stop-color="#FFF6D5"/>
      <stop offset="45%" stop-color="#D4A45C"/>
      <stop offset="100%" stop-color="#D4A45C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Glow -->
  <circle cx="128" cy="74" r="42" fill="url(#light)"/>

  <!-- Left beam -->
  <path d="M128 70
           L36 95
           L36 108
           L128 84Z"
        fill="#D4A45C"
        opacity=".18"/>

  <!-- Right beam -->
  <path d="M128 70
           L220 95
           L220 108
           L128 84Z"
        fill="#D4A45C"
        opacity=".18"/>

  <!-- Roof -->
  <path d="M92 58 L128 38 L164 58 Z"
        fill="#F2EDE3"/>

  <!-- Lantern -->
  <rect x="105" y="58" width="46" height="20" rx="2"
        fill="#F2EDE3"/>

  <rect x="112" y="58" width="4" height="20" fill="#0D1420" opacity=".2"/>
  <rect x="140" y="58" width="4" height="20" fill="#0D1420" opacity=".2"/>

  <!-- Tower -->
  <path d="M108 78
           L148 78
           L140 186
           L116 186Z"
        fill="url(#tower)"/>

  <!-- Shadow -->
  <path d="M128 78
           L148 78
           L140 186
           L128 186Z"
        fill="#000"
        opacity=".14"/>

  <!-- Door -->
  <path d="M120 186
           L120 152
           A8 8 0 0 1 136 152
           L136 186Z"
        fill="#0D1420"/>

  <!-- Ground -->
  <path d="M88 186
           Q128 170 168 186"
        fill="none"
        stroke="#F2EDE3"
        stroke-width="6"
        stroke-linecap="round"/>
</svg>
