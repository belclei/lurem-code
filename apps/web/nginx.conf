server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # TanStack Router does client-side routing — any path that isn't a real
  # static file falls back to index.html so the SPA can take over.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long cache for hashed build assets; index.html itself is never cached
  # (it's the one file that must always be revalidated to pick up a new
  # deploy's asset hashes).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # nginx:1.27-alpine's stock mime.types has no .mjs entry, so it falls back
  # to default_type (application/octet-stream) — browsers refuse to load
  # that as a module script (strict MIME checking). pdf.js's worker ships
  # as .mjs, so this broke PDF import (Setting up fake worker failed).
  location ~ \.mjs$ {
    types { application/javascript mjs; }
    default_type application/javascript;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
