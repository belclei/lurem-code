name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lurem
          POSTGRES_PASSWORD: lurem
          POSTGRES_DB: lurem
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U lurem"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lurem:lurem@localhost:5433/lurem?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-not-used-in-prod-32-bytes
      GOOGLE_CLIENT_ID: ci-placeholder
      RESEND_API_KEY: ci-placeholder
      RESEND_WEBHOOK_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npm run generate --workspace=@lurem/db && npx --workspace=@lurem/db prisma migrate deploy
      - name: Lint
        run: |
          ./node_modules/.bin/biome check apps/api/src packages/core/src packages/ui/src packages/web/src --write --no-errors-on-unmatched
      - name: Typecheck
        run: npm run typecheck
      - name: Architecture boundaries
        run: npm run boundaries
      - name: Tests
        run: npm test

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"

            # Bootstrap in place, never by deleting: .env.prod lives here
            # untracked and cannot be restored from git.
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              mkdir -p "$DEPLOY_PATH"
              cd "$DEPLOY_PATH"
              git init -q
              git symbolic-ref HEAD refs/heads/master
              git remote add origin ${{ github.server_url }}/${{ github.repository }}.git
            fi

            cd "$DEPLOY_PATH"
            git fetch origin master
            git reset --hard origin/master

            # -p harmon: live volumes are harmon_harmon_{postgres,redis}_data.
            # Without it Compose derives the project from the directory name
            # and starts against empty volumes without failing.
            docker compose -p harmon -f docker-compose.prod.yml --env-file .env.prod up -d --build
            docker image prune -f
