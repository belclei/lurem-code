name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lurem
          POSTGRES_PASSWORD: lurem
          POSTGRES_DB: lurem
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U lurem"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lurem:lurem@localhost:5433/lurem?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-not-used-in-prod-32-bytes
      GOOGLE_CLIENT_ID: ci-placeholder
      RESEND_API_KEY: ci-placeholder
      RESEND_WEBHOOK_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npm run generate --workspace=@lurem/db && npx --workspace=@lurem/db prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Architecture boundaries
        run: npm run boundaries
      - name: Tests
        run: npm test

  deploy:
    needs: quality
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin master
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
            docker image prune -f
