# docker-compose.prod.yml — Hostinger VPS deploy, behind the pre-installed
# Traefik (host network, auto-discovers containers via the Docker socket —
# see ARQUITETURA.md §7.x). Local dev keeps using docker-compose.yml
# (Postgres/Redis only); this file is the full production stack.
#
# Usage on the VPS:
#   cp .env.prod.example .env.prod   # fill in real secrets, never commit
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lurem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lurem
    volumes:
      - harmon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmon"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - harmon_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot: applies pending Prisma migrations, then exits. api waits for
  # this to finish successfully before starting (ARQUITETURA.md §7.x:
  # "aplicada por serviço migrator no deploy").
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npm run migrate:deploy --workspace=@lurem/db
    environment:
      DATABASE_URL: postgresql://lurem:${POSTGRES_PASSWORD}@postgres:5432/lurem?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://lurem:${POSTGRES_PASSWORD}@postgres:5432/lurem?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET}
      PORT: "3001"
      WEB_APP_URL: https://${DOMAIN}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lurem-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/v1`)"
      - "traefik.http.routers.lurem-api.entrypoints=websecure"
      - "traefik.http.routers.lurem-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.lurem-api.priority=10"
      - "traefik.http.services.lurem-api.loadbalancer.server.port=3001"

  # Daily jobs (issues.md: fechamento/vencimento de fatura precisa rodar
  # sozinho — o mesmo vale pros outros dois jobs "diários" que também nunca
  # tinham um scheduler real). Same image as `api`, just runs crond instead
  # of the HTTP server — see apps/api/cron/crontab for the schedule.
  cron:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    entrypoint: ["/app/apps/api/cron/entrypoint.sh"]
    # Herda o HEALTHCHECK do apps/api/Dockerfile (wget em :3001/health), mas
    # este serviço roda crond, não o servidor HTTP — desabilita pra não
    # ficar "unhealthy" pra sempre por um endpoint que nunca vai existir aqui.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://lurem:${POSTGRES_PASSWORD}@postgres:5432/lurem?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET}
      WEB_APP_URL: https://${DOMAIN}
      TZ: America/Sao_Paulo
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lurem-web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.lurem-web.entrypoints=websecure"
      - "traefik.http.routers.lurem-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.lurem-web.priority=1"
      - "traefik.http.services.lurem-web.loadbalancer.server.port=8080"

volumes:
  harmon_postgres_data:
  harmon_redis_data:
